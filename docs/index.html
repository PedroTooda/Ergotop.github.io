<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>ERGOTOP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="https://www.raylib.com/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    #header {
      background: #081925;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #logo-links {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    #logo-links h2 {
      margin: 0;
      color: gold;
      font-size: 24px;
    }

    #logo-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #logo-img {
      height: 22px;
    }

    #controls {
      display: flex;
      gap: 8px;
    }

    #controls button {
      background: #eee;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ===== GAME AREA ===== */
    #game-container {
      flex: 1;
      background: #081925;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: black;
    }

    @media (max-width: 768px) {
      #logo-links h2 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div id="header">
    <div id="logo-links">
      <h2>ERGOTOP</h2>
      <a href="https://sites.google.com/ifsuldeminas.edu.br/programa-educativo-2/in%C3%ADcio">🌐 Pesquisa</a>
      <a href="https://www.raylib.com" target="_blank">
        <img id="logo-img" src="https://www.raylib.com/favicon.ico">
        Raylib
      </a>
    </div>

    <div id="controls">
      <button onclick="goFullscreen()">🖵 FULLSCREEN</button>
      <button id="btn-audio" onclick="toggleAudio()">🔇 MUTE</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-container">
    <canvas id="canvas" class="emscripten" tabindex="-1"></canvas>
  </div>

  <!-- SCRIPT -->
  <script>
    /* ================= CONFIG ================= */
    const ASPECT = 16 / 9;

    /* ================= AUDIO ================= */
    let audioBtn = null;
    const audioContexts = [];

    self.AudioContext = new Proxy(self.AudioContext, {
      construct(target, args) {
        const ctx = new target(...args);
        audioContexts.push(ctx);
        return ctx;
      }
    });

    function toggleAudio() {
      if (!audioBtn) audioBtn = document.getElementById("btn-audio");
      let muted = true;

      audioContexts.forEach(ctx => {
        if (ctx.state === "suspended") {
          ctx.resume();
          muted = false;
        } else {
          ctx.suspend();
        }
      });

      audioBtn.textContent = muted ? "🔈 RESUME" : "🔇 MUTE";
    }

    /* ================= EMSCRIPTEN ================= */
    var Module = {
      canvas: document.getElementById("canvas"),
      onRuntimeInitialized() {
        resizeCanvas();
      }
    };

    function resizeCanvas() {
      const canvas = Module.canvas;
      const container = document.getElementById("game-container");

      const cw = container.clientWidth;
      const ch = container.clientHeight;

      if (cw <= 0 || ch <= 0) return;

      // calcula maior 16:9 que cabe no espaço
      let width = cw;
      let height = width / ASPECT;

      if (height > ch) {
        height = ch;
        width = height * ASPECT;
      }

      const dpr = window.devicePixelRatio || 1;

      // tamanho visual
      canvas.style.width  = Math.floor(width) + "px";
      canvas.style.height = Math.floor(height) + "px";

      // tamanho interno (CRÍTICO)
      canvas.width  = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
    }

    function goFullscreen() {
      Module.requestFullscreen(false, false);
      setTimeout(resizeCanvas, 300);
    }

    /* ================= EVENTOS ================= */
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => {
      setTimeout(resizeCanvas, 200);
    });

    document.addEventListener("fullscreenchange", () => {
      setTimeout(resizeCanvas, 300);
    });
  </script>

  <!-- JOGO -->
  <script src="main.js"></script>

</body>
</html>
