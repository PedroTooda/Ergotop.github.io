<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>ERGOTOP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://www.raylib.com/favicon.ico" rel="icon">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    #header {
      width: 100%;
      min-height: 60px;
      background-color: #081925;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 10px;
      flex-wrap: wrap;
    }

    #logo-links {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    #logo-links h2 {
      margin: 0;
      color: gold;
      font-size: 30px;
    }

    #logo-links a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
    }

    #logo-img {
      height: 24px;
    }

    #controls {
      display: flex;
      gap: 8px;
    }

    #controls button {
      background-color: #eee;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    /* ===== GAME AREA ===== */
    #game-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #081925;
      overflow: hidden;
      padding: 8px;
    }

    canvas {
      background: #000;
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      aspect-ratio: 16 / 9; /* AJUSTE PARA O ASPECT DO SEU JOGO */
    }

    /* ===== MOBILE AJUSTES ===== */
    @media (max-width: 768px) {
      #logo-links h2 {
        font-size: 18px;
      }

      #controls button {
        font-size: 13px;
        padding: 6px 8px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div id="header">
    <div id="logo-links">
      <h2>ERGOTOP</h2>
      <a href="https://sites.google.com/ifsuldeminas.edu.br/programa-educativo-2/in%C3%ADcio">🌐 Site da Pesquisa</a>
      <a href="https://www.raylib.com" target="_blank">
        <img id="logo-img" src="https://www.raylib.com/favicon.ico" alt="Raylib Logo">
        Raylib
      </a>
    </div>

    <div id="controls">
      <button onclick="Module.requestFullscreen(false, false)">🖵 FULLSCREEN</button>
      <button onclick="toggleAudio()" id="btn-audio">🔇 MUTE</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <!-- EMSCRIPTEN / AUDIO -->
  <script>
    var audioBtn = null;
    const audioContexList = [];

    function toggleAudio() {
      if (!audioBtn) audioBtn = document.querySelector("#btn-audio");
      let muted = true;

      audioContexList.forEach(ctx => {
        if (ctx.state === "suspended") {
          ctx.resume();
          muted = false;
        } else {
          ctx.suspend();
        }
      });

      audioBtn.textContent = muted ? "🔈 RESUME" : "🔇 MUTE";
    }

    self.AudioContext = new Proxy(self.AudioContext, {
      construct(target, args) {
        const ctx = new target(...args);
        audioContexList.push(ctx);
        return ctx;
      }
    });

    var Module = {
      canvas: (() => document.getElementById("canvas"))(),
      setStatus: text => console.log(text)
    };

    /* ===== AJUSTE DINÂMICO DO CANVAS ===== */
    function resizeCanvas() {
      const canvas = Module.canvas;
      const container = document.getElementById("game-container");

      const aspect = 16 / 9; // MESMO ASPECT DO JOGO
      let width = container.clientWidth;
      let height = container.clientHeight;

      if (width / height > aspect) {
        width = height * aspect;
      } else {
        height = width / aspect;
      }

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    window.addEventListener("load", resizeCanvas);
  </script>

  <!-- JOGO -->
  <script src="main.js"></script>
</body>
</html>
