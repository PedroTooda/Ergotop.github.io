<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>ERGOTOP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://www.raylib.com/favicon.ico" rel="icon">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    #header {
      width: 100%;
      min-height: 60px;
      background-color: #081925;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 10px;
      flex-wrap: wrap;
    }

    #logo-links {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    #logo-links h2 {
      margin: 0;
      color: gold;
      font-size: 30px;
    }

    #logo-links a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
    }

    #logo-img {
      height: 24px;
    }

    #controls {
      display: flex;
      gap: 8px;
    }

    #controls button {
      background-color: #eee;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    /* ===== GAME AREA ===== */
    #game-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #081925;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #000;
    }

    /* ===== MOBILE AJUSTES ===== */
    @media (max-width: 768px) {
      #logo-links h2 {
        font-size: 18px;
      }

      #controls button {
        font-size: 13px;
        padding: 6px 8px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div id="header">
    <div id="logo-links">
      <h2>ERGOTOP</h2>
      <a href="https://sites.google.com/ifsuldeminas.edu.br/programa-educativo-2/in%C3%ADcio">🌐 Site da Pesquisa</a>
      <a href="https://www.raylib.com" target="_blank">
        <img id="logo-img" src="https://www.raylib.com/favicon.ico" alt="Raylib Logo">
        Raylib
      </a>
    </div>

    <div id="controls">
      <button onclick="Module.requestFullscreen(false, false)">🖵 FULLSCREEN</button>
      <button onclick="toggleAudio()" id="btn-audio">🔇 MUTE</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <!-- EMSCRIPTEN / AUDIO -->
  <script>
    var audioBtn = null;
  const audioContexList = [];

  function toggleAudio() {
    if (!audioBtn) audioBtn = document.querySelector("#btn-audio");
    let muted = true;

    audioContexList.forEach(ctx => {
      if (ctx.state === "suspended") {
        ctx.resume();
        muted = false;
      } else {
        ctx.suspend();
      }
    });

    audioBtn.textContent = muted ? "🔈 RESUME" : "🔇 MUTE";
  }

  self.AudioContext = new Proxy(self.AudioContext, {
    construct(target, args) {
      const ctx = new target(...args);
      audioContexList.push(ctx);
      return ctx;
    }
  });

  var Module = {
    canvas: (() => document.getElementById("canvas"))(),
    setStatus: text => console.log(text)
  };

  const ASPECT = 16 / 9;

  function resizeCanvas() {
    const canvas = Module.canvas;
    const container = document.getElementById("game-container");

    if (!canvas || !container) return;

    const cw = container.clientWidth;
    const ch = container.clientHeight;

    // proteção contra valores inválidos (bug ao sair do fullscreen)
    if (cw <= 0 || ch <= 0) return;

    let width = cw;
    let height = width / ASPECT;

    if (height > ch) {
      height = ch;
      width = height * ASPECT;
    }

    canvas.style.width = `${Math.floor(width)}px`;
    canvas.style.height = `${Math.floor(height)}px`;
  }

  function goFullscreen() {
    Module.requestFullscreen(false, false);
    setTimeout(resizeCanvas, 300);
  }

  // 🔑 evento CRÍTICO
  document.addEventListener("fullscreenchange", () => {
    setTimeout(resizeCanvas, 300);
  });

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", () => {
    setTimeout(resizeCanvas, 200);
  });
  window.addEventListener("load", resizeCanvas);
  </script>

  <!-- JOGO -->
  <script src="main.js"></script>
</body>

</html>
